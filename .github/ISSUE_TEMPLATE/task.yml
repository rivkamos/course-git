
name: "📋 Development Task"
description: "Create a new development task"
title: "[TASK] "
labels:
  - task

body:
  - type: textarea
    id: objective
    attributes:
      label: Task Description
      description: What needs to be done?
      placeholder: Describe the task...
    validations:
      required: true

  - type: textarea
    id: requirements
    attributes:
      label: Requirements
      description: What are the expected results?
      placeholder: |
        - Requirement 1
        - Requirement 2
        - Requirement 3
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - High
        - Medium
        - Low
    validations:
      required: true

  - type: input
    id: assignee
    attributes:
      label: Responsible Developer
      placeholder: GitHub username
